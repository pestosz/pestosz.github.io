{% extends 'base.html' %}

{% block title %}Edit Book {{ book['title'] }} ({{ book['id'] }}){% endblock %}
{% block body_class %}edit{% endblock %}

{% block content %}
    <h1>Edit Book {{ book['title'] }} ({{ book['id'] }})</h1>
    <form action="{{ url_for('book_edit', book_id=book['id']) }}" method="post" class="edit-form">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{{ book['title'] }}" required>
        </div>

        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" value="{{ book['author'] }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ book['description'] }}</textarea>
        </div>

        <div class="form-group">
            <label></label>
            <input type="submit" value="Submit">
        </div>
    </form>

    <ul class="action-list">
        <li><a href="{{ url_for('book_index') }}">Back to list</a></li>
        <li>
            <form action="{{ url_for('book_delete', book_id=book['id']) }}" method="post" style="display:inline;">
                <input type="submit" value="Delete" onclick="return confirm('Are you sure?')">
            </form>
        </li>
    </ul>
{% endblock %}
